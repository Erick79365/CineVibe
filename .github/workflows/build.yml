name: Build CineVibe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q CineVibeAndroid-project.zip
          ls -la

      - name: Build APK
        run: |
          cd CineVibeAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineVibe-APK
          path: CineVibeAndroid/app/build/outputs/apk/debug/app-debug.apk
