
name: Build CineVibe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Encontrar e extrair projeto
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "CineVibeAndroid-project-v3.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Arquivo CineVibeAndroid-project.zip não encontrado!"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Gradle não encontrado!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Verificar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK não foi gerado!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "Tamanho do APK: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "APK muito pequeno. Verifique o projeto."
            exit 1
          fi

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: CineVibe-APK-verified
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
