
name: Build CineVibe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto V3
        run: |
          ZIP="CineVibeAndroid-project-v3.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP V3 nao encontrado!"
            ls -la
            exit 1
          fi

          echo "Conteudo do ZIP:"
          unzip -l "$ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "Arquivos extraidos:"
          find extracted -maxdepth 5 -type f | sort | head -200

          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Gradle nao encontrado!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Localizar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK nao foi gerado!"
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          echo "APK encontrado: $APK"
          echo "Tamanho: $SIZE bytes"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Enviar APK para analise
        uses: actions/upload-artifact@v4
        with:
          name: CineVibe-APK-analise
          path: ${{ env.APK_PATH }}
